<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>a calculator to replace others</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI Variable", "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background 1s ease, color 1s ease;
      overflow: hidden;
      position: relative;
    }

    /* LIGHT dreamy background */
    body.light::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 20% 30%, #c2b7f5, transparent 50%),
        radial-gradient(circle at 80% 70%, #b7e7f5, transparent 50%),
        radial-gradient(circle at 40% 80%, #f5b7d3, transparent 50%);
      filter: blur(120px);
      animation: driftLight 60s infinite alternate ease-in-out;
      z-index: -1;
    }

    /* DARK Windows 11 style background */
    body.dark::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 25% 30%, rgba(0, 120, 200, 0.4), transparent 60%),
        radial-gradient(circle at 75% 60%, rgba(0, 200, 150, 0.3), transparent 60%),
        linear-gradient(135deg, #0e1116, #1a1f25 50%, #101214);
      filter: blur(150px);
      animation: driftDark 80s infinite alternate ease-in-out;
      z-index: -1;
    }

    @keyframes driftLight {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(-100px, -60px) scale(1.05);
      }
      100% {
        transform: translate(80px, 40px) scale(1.1);
      }
    }

    @keyframes driftDark {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(-120px, -80px) scale(1.08);
      }
      100% {
        transform: translate(100px, 60px) scale(1.05);
      }
    }

    body.dark {
      color: #e5e9ef;
    }

    body.light {
      color: #1c1c21;
    }

    .calculator {
      width: 340px;
      padding: 24px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(30px);
      animation: fadeInUp 1.2s ease forwards, floaty 6s ease-in-out infinite;
      transition: all 0.8s ease;
    }

    body.dark .calculator {
      background: rgba(20, 24, 30, 0.6);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    body.light .calculator {
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floaty {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
      100% {
        transform: translateY(0);
      }
    }

    /* Toggle */
    .toggle-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .toggle-btn {
      background: linear-gradient(135deg, #7f91f3, #56c3f0);
      border: none;
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #fff;
      transition: all 0.6s ease;
      position: relative;
      overflow: hidden;
    }

    .toggle-btn::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 120%;
      top: -10%;
      left: -10%;
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .toggle-btn:hover::after {
      transform: translateX(100%);
    }

    /* Display */
    #result {
      width: 100%;
      height: 70px;
      font-size: 28px;
      text-align: right;
      padding: 12px 16px;
      border: none;
      border-radius: 18px;
      margin-bottom: 20px;
      outline: none;
      transition: all 0.6s ease;
    }

    body.dark #result {
      background: linear-gradient(145deg, #161a21, #1f2530);
      color: #e0e6ef;
    }

    body.light #result {
      background: linear-gradient(145deg, #ffffff, #f6f7fa);
      color: #222;
    }

    /* Button grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.5s ease;
      position: relative;
      overflow: hidden;
    }

    /* Ripple glow */
    button:active::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      animation: ripple 0.6s linear;
    }

    @keyframes ripple {
      from {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1);
      }
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(12);
      }
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: scale(0.95);
    }

    body.dark button {
      background: linear-gradient(145deg, #1c1f26, #222831);
      color: #e5e9ef;
    }

    body.light button {
      background: linear-gradient(145deg, #f1f1f6, #e8e9ef);
      color: #1e1e25;
    }

    /* Special buttons */
    .operator {
      background: linear-gradient(145deg, #3c6fd1, #3498db) !important;
      color: #fff !important;
    }

    .equal {
      grid-column: span 2;
      background: linear-gradient(145deg, #2ecc71, #27ae60) !important;
      color: #fff !important;
    }

    .clear {
      background: linear-gradient(145deg, #e74c3c, #c0392b) !important;
      color: #fff !important;
    }
  </style>
</head>

<body class="dark">
  <div class="calculator">
    <div class="toggle-container">
      <button class="toggle-btn" onclick="toggleMode()">🌙 Dark Mode</button>
    </div>
    <input type="text" id="result" readonly>

    <div class="buttons">
      <button onclick="clr()" class="clear">C</button>
      <button onclick="dis('/')" class="operator">÷</button>
      <button onclick="dis('*')" class="operator">×</button>
      <button onclick="dis('-')" class="operator">−</button>

      <button onclick="dis('7')">7</button>
      <button onclick="dis('8')">8</button>
      <button onclick="dis('9')">9</button>
      <button onclick="dis('+')" class="operator">+</button>

      <button onclick="dis('4')">4</button>
      <button onclick="dis('5')">5</button>
      <button onclick="dis('6')">6</button>
      <button onclick="dis('.')">.</button>

      <button onclick="dis('1')">1</button>
      <button onclick="dis('2')">2</button>
      <button onclick="dis('3')">3</button>
      <button onclick="dis('0')">0</button>

      <button onclick="solve()" class="equal">=</button>
    </div>
  </div>

  <script>
    function dis(val) {
      document.getElementById("result").value += val
    }

    function solve() {
      let x = document.getElementById("result").value
      try {
        let y = math.evaluate(x)
        document.getElementById("result").value = y
      } catch {
        document.getElementById("result").value = "Error"
      }
    }

    function clr() {
      document.getElementById("result").value = ""
    }

    function toggleMode() {
      let body = document.body;
      let toggleBtn = document.querySelector(".toggle-btn");
      if (body.classList.contains("dark")) {
        body.classList.replace("dark", "light");
        toggleBtn.textContent = "☀️ Light Mode";
      } else {
        body.classList.replace("light", "dark");
        toggleBtn.textContent = "🌙 Dark Mode";
      }
    }

    document.addEventListener("keydown", function (event) {
      if (!isNaN(event.key) || "+-*/.".includes(event.key)) {
        dis(event.key)
      } else if (event.key === "Enter") {
        solve()
      } else if (event.key === "Backspace") {
        let input = document.getElementById("result")
        input.value = input.value.slice(0, -1)
      }
    });
  </script>
</body>

</html>
